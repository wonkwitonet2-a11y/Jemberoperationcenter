name: Build semua
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: unzip -q jemberoperationcenter-apk-debug.zip -d apk
      - run: npm install
        working-directory: apk
      - run: npx cap add android
        working-directory: apk
      - name: Izin kamera dan lokasi
        working-directory: apk
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <application|' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
        working-directory: apk
      - run: |
          chmod +x gradlew
          ./gradlew assembleDebug
        working-directory: apk/android
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apk/android/app/build/outputs/apk/debug/app-debug.apk
  yakult:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: unzip -q yakult-jember-github-pages.zip -d yakult
      - run: npm install
        working-directory: yakult
      - run: npm run build
        working-directory: yakult
      - uses: actions/upload-pages-artifact@v3
        with:
          path: yakult/dist
  deploy:
    needs: yakult
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
