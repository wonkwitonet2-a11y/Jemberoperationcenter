<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="color-scheme" content="light dark">
<title>Jember Operation Center</title>
<style>
:root{--bg:#0a0a0a;--sat:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));--sab:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px))}
@media (prefers-color-scheme:dark){:root.auto{--bg:#0a0a0a}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg,#0a0a0a);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
[hidden]{display:none!important}
#stage{position:fixed;inset:0;background:var(--bg,#0a0a0a);padding:var(--sat) 0 var(--sab) 0}
#frame{width:100%;height:100%;border:0;display:block;background:transparent;color-scheme:normal}
#gear{position:fixed;top:calc(var(--sat) + 10px);right:10px;width:42px;height:42px;border:0;border-radius:50%;background:rgba(18,38,58,.8);color:#fff;display:grid;place-items:center;cursor:pointer;z-index:20;padding:0}
#gear svg{width:22px;height:22px}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:30}
.card{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:380px}
h2{margin:0 0 12px;font-size:18px;color:#171717}
label{display:block;font-size:14px;font-weight:600;margin-bottom:6px;color:#262626}
input{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid #d4d4d4;border-radius:8px}
input:focus,button:focus-visible{outline:3px solid #8db1de;outline-offset:1px}
.hint{font-size:13px;color:#737373;margin:8px 0 0}
.msg{font-size:14px;color:#be123c;min-height:20px;margin:8px 0 0}
.row{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;padding:12px;font:inherit;font-weight:700;font-size:15px;border:0;border-radius:8px;cursor:pointer;background:#1d4f91;color:#fff}
.btn.alt{background:#e5e5e5;color:#262626}

/* ===== Splash JOC ===== */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(120% 90% at 50% 42%,#12396b 0%,#0C2D57 55%,#08213f 100%);transition:opacity .5s ease,transform .5s ease}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
#splash .logo{display:grid;place-items:center;width:240px;height:150px}
#splash .word{grid-area:1/1;display:flex;gap:10px;font:800 56px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
#splash .word span{display:block;width:54px;text-align:center;opacity:0}
#splash .word .j{animation:lIn .55s cubic-bezier(.2,.7,.2,1) .15s forwards,jOut .6s cubic-bezier(.65,0,.35,1) 1s forwards}
#splash .word .o{animation:lIn .55s cubic-bezier(.2,.7,.2,1) .25s forwards,oOut .6s cubic-bezier(.65,0,.35,1) 1s forwards}
#splash .word .c{animation:lIn .55s cubic-bezier(.2,.7,.2,1) .35s forwards,cOut .6s cubic-bezier(.65,0,.35,1) 1s forwards}
#splash .mark{grid-area:1/1;width:120px;height:133px;overflow:visible;animation:pop .8s cubic-bezier(.2,.7,.2,1) 1.05s both}
#splash .stroke{fill:none;stroke:#fff;stroke-width:11;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:0;animation:draw .8s cubic-bezier(.65,0,.35,1) 1.05s forwards}
#splash .dot,#splash .ring{transform-box:fill-box;transform-origin:center;opacity:0}
#splash .dot{fill:#E3242B;animation:drop .55s cubic-bezier(.34,1.56,.64,1) 1.7s forwards}
#splash .ring{fill:none;stroke:#E3242B;stroke-width:3;animation:ring 1.7s ease-out 2.3s infinite}
#splash .sub{margin:26px 0 0;font:500 15px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.03em;color:rgba(255,255,255,.72);opacity:0;animation:fade .6s ease 1.9s forwards}
@keyframes lIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes jOut{from{opacity:1;transform:none;filter:blur(0)}to{opacity:0;transform:translateX(64px) scale(.5);filter:blur(5px)}}
@keyframes oOut{from{opacity:1;transform:none;filter:blur(0)}to{opacity:0;transform:scale(.5);filter:blur(5px)}}
@keyframes cOut{from{opacity:1;transform:none;filter:blur(0)}to{opacity:0;transform:translateX(-64px) scale(.5);filter:blur(5px)}}
@keyframes pop{from{transform:scale(.88)}to{transform:scale(1)}}
@keyframes draw{0%{opacity:1;stroke-dashoffset:1}100%{opacity:1;stroke-dashoffset:0}}
@keyframes drop{0%{opacity:0;transform:translateY(-24px) scale(.3)}50%{opacity:1}100%{opacity:1;transform:none}}
@keyframes ring{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.8)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  #splash .word{display:none}
  #splash .mark,#splash .stroke,#splash .dot,#splash .sub{animation:none}
  #splash .stroke{opacity:1;stroke-dashoffset:0}
  #splash .dot{opacity:1}
  #splash .ring{display:none}
  #splash .sub{opacity:1}
  #splash{transition:opacity .3s ease}
}
</style>
</head>
<body>
<div id="splash" role="status" aria-label="Memuat aplikasi">
  <div class="logo">
    <div class="word" aria-hidden="true"><span class="j">J</span><span class="o">O</span><span class="c">C</span></div>
    <svg class="mark" viewBox="50 38 90 100" aria-hidden="true">
      <path class="stroke" pathLength="1" d="M125 74 V92 A30 30 0 0 1 65 92 A30 30 0 0 1 95 62"/>
      <circle class="ring" cx="125" cy="54" r="8"/>
      <circle class="dot" cx="125" cy="54" r="8"/>
    </svg>
  </div>
  <p class="sub">Jember Operation Center</p>
</div>
<div id="probe" style="position:fixed;left:0;top:0;width:0;visibility:hidden;padding-top:var(--sat);padding-bottom:var(--sab)"></div>
<div id="probe2" style="position:fixed;left:0;top:0;width:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px)"></div>
<div id="dbg" style="position:fixed;left:6px;right:6px;top:130px;z-index:9999;background:rgba(0,0,0,.82);color:#7CFC00;font:11px/1.35 monospace;padding:6px 8px;border-radius:8px;white-space:pre-wrap;pointer-events:auto"></div>
<div id="stage"><iframe id="frame" title="Aplikasi" allow="camera; microphone; geolocation; clipboard-read; clipboard-write; fullscreen; downloads; payment"></iframe></div>

<button id="gear" type="button" aria-label="Pengaturan link">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
</button>

<div id="sheet" hidden>
  <div class="card" role="dialog" aria-labelledby="ttl">
    <h2 id="ttl">Link aplikasi</h2>
    <label for="url">Alamat link</label>
    <input id="url" type="url" inputmode="url" autocapitalize="off" autocomplete="off" placeholder="https://contoh.com/app">
    <p class="hint">Isi link, simpan, lalu masuk seperti biasa.</p>
    <p class="msg" id="msg" role="alert"></p>
    <div class="row">
      <button class="btn alt" id="cancel" type="button">Batal</button>
      <button class="btn alt" id="reset" type="button">Link bawaan</button>
      <button class="btn" id="save" type="button">Simpan link</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
(function(){
  var C = window.APP_CONFIG || {};
  var $ = function(id){return document.getElementById(id)};
  var frame=$("frame"), gear=$("gear"), sheet=$("sheet"), input=$("url"), msg=$("msg");
  var origin="", loggedIn=false, edge=false;
  function sendInset(){
    try{
      var cs=getComputedStyle($("probe"));
      var t=parseFloat(cs.paddingTop)||0, b=parseFloat(cs.paddingBottom)||0;
      frame.contentWindow.postMessage({type:"yk-inset",top:t,bottom:b},"*"); window.__dbgInfo.sent="top="+t+" bottom="+b;
    }catch(e){}
  }
  window.addEventListener("resize",function(){if(edge)sendInset()});
  // Capacitor mengisi inset secara asinkron; ukur ulang berkala dan saat atribut style <html> berubah.
  var lastInset="";
  function pollInset(){
    if(!edge) return;
    try{
      var cs=getComputedStyle($("probe"));
      var k=cs.paddingTop+"|"+cs.paddingBottom;
      if(k!==lastInset){lastInset=k;sendInset()}
    }catch(e){}
  }
  var dbgInfo={appMsgs:{},sent:"-",ack:"-"};
  function renderDbg(){
    try{
      var d=$("dbg"); if(!d) return;
      var rs=getComputedStyle(document.documentElement);
      var ua=(navigator.userAgent.match(/Chrome\/(\d+)/)||[])[1];
      d.textContent="DEBUG (ketuk untuk tutup)\n"+
        "env top: "+getComputedStyle($("probe2")).paddingTop+"\n"+
        "var top: "+(rs.getPropertyValue("--safe-area-inset-top")||"(kosong)")+"\n"+
        "sat/probe: "+getComputedStyle($("probe")).paddingTop+"\n"+
        "edge: "+edge+"  dpr: "+window.devicePixelRatio+"  WebView: "+ua+"\n"+
        "inner: "+innerWidth+"x"+innerHeight+"  screen: "+screen.width+"x"+screen.height+"\n"+
        "dikirim ke app: "+dbgInfo.sent+"\n"+
        "balasan app: "+dbgInfo.ack+"\n"+
        "pesan dari app: "+Object.keys(dbgInfo.appMsgs).map(function(k){return k+"x"+dbgInfo.appMsgs[k]}).join(", ");
    }catch(e){}
  }
  window.__dbgInfo=dbgInfo;
  setInterval(renderDbg,700);
  document.addEventListener("click",function(e){var d=$("dbg"); if(d&&d.contains(e.target)) d.hidden=true});
  setInterval(pollInset,500);
  try{new MutationObserver(pollInset).observe(document.documentElement,{attributes:true,attributeFilter:["style"]})}catch(e){}
  try{var lastBg=localStorage.getItem("joc_bg2"); if(lastBg) document.documentElement.style.setProperty("--bg",lastBg)}catch(e){}
  var store={
    get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},
    set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  };
  function normalize(v){
    v=(v||"").trim(); if(!v) return "";
    if(!/^https?:\/\//i.test(v)) v="https://"+v;
    try{return new URL(v).href}catch(e){return ""}
  }
  // Link bawaan dari config.js selalu jadi cadangan: hapus data aplikasi pun, link tetap terisi otomatis.
  function currentUrl(){return normalize(store.get("joc_url"))||normalize(C.defaultUrl)||""}
  // Tambah penanda waktu agar WebView selalu mengambil versi TERBARU (tidak memakai cache lama) saat aplikasi dibuka.
  function fresh(u){
    try{var x=new URL(u); x.searchParams.set("_t",String(Date.now())); return x.href}catch(e){return u}
  }
  function updateGear(){gear.hidden=loggedIn}
  function openSheet(){input.value=currentUrl();msg.textContent="";$("cancel").hidden=!currentUrl();sheet.hidden=false;input.focus({preventScroll:true})}
  function closeSheet(){sheet.hidden=true}
  function load(){
    var u=currentUrl(); loggedIn=false; updateGear();
    if(!u){frame.removeAttribute("src");hideSplash();openSheet();return}
    try{origin=new URL(u).origin}catch(e){origin=""}
    frame.src=fresh(u);
  }
  frame.addEventListener("load",function(){
    function ping(){try{frame.contentWindow.postMessage({type:"yk-ping"},"*")}catch(e){}}
    ping(); setTimeout(ping,1500); setTimeout(ping,4000);
  });
  gear.addEventListener("click",openSheet);
  $("cancel").addEventListener("click",closeSheet);
  $("save").addEventListener("click",function(){
    var u=normalize(input.value);
    if(!u){msg.textContent="Link tidak valid. Contoh: https://contoh.com";return}
    store.set("joc_url",u); closeSheet(); load();
  });
  $("reset").addEventListener("click",function(){
    try{localStorage.removeItem("joc_url")}catch(e){}
    closeSheet(); load();
  });
  input.addEventListener("keydown",function(e){if(e.key==="Enter")$("save").click()});
  window.addEventListener("message",function(e){
    if(e.source!==frame.contentWindow) return;
    var d=e.data; if(!d) return; try{window.__dbgInfo.appMsgs[d.type]=(window.__dbgInfo.appMsgs[d.type]||0)+1; if(d.type==="yk-dbg") window.__dbgInfo.ack=JSON.stringify(d)}catch(x){}
    if(d.type==="yk-auth"){loggedIn=!!d.loggedIn;updateGear();if(loggedIn)closeSheet()}
    else if(d.type==="yk-edge"){edge=true;document.getElementById("stage").style.padding="0";lastInset="";sendInset();pollInset()}
    else if(d.type==="yk-theme"){
      try{var SB=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.SystemBars; if(SB&&SB.setStyle) SB.setStyle({style:d.dark?"DARK":"LIGHT"})}catch(x){}
      var bg=(typeof d.color==="string"&&/^#[0-9a-f]{6}$/i.test(d.color))?d.color:(d.dark?"#0a0a0a":"#f5f5f4");
      document.documentElement.style.setProperty("--bg",bg);
      var m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute("content",bg);
      store.set("joc_bg2",bg);
    }
    else if(d.type==="yk-cred-set"){
      if(typeof d.u==="string" && typeof d.k==="string" && d.u && d.k) store.set("joc_cred",JSON.stringify({u:d.u,k:d.k,locked:!!d.locked}));
    }
    else if(d.type==="yk-cred-clear"){try{localStorage.removeItem("joc_cred")}catch(x){}}
    else if(d.type==="yk-clip"){
      // Jembatan clipboard: aplikasi di dalam iframe tidak boleh membaca clipboard di WebView, jadi shell yang membacakan.
      var CB=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Clipboard;
      var rep=function(o){o.type="yk-clip-result";o.id=d.id;try{frame.contentWindow.postMessage(o,origin||"*")}catch(x){}};
      if(!CB){rep({ok:false});return}
      if(d.op==="read"){
        CB.read().then(function(r){rep({ok:true,text:(r&&typeof r.value==="string")?r.value:""})}).catch(function(){rep({ok:false})});
      }else if(d.op==="write"&&typeof d.text==="string"){
        CB.write({string:d.text}).then(function(){rep({ok:true})}).catch(function(){rep({ok:false})});
      }else rep({ok:false});
    }
    else if(d.type==="yk-cred-get"){
      var raw=store.get("joc_cred"); if(!raw) return;
      try{
        var c=JSON.parse(raw);
        if(c && c.u && c.k) frame.contentWindow.postMessage({type:"yk-cred",u:c.u,k:c.k,locked:!!c.locked},origin||"*");
      }catch(x){}
    }
  });
  // ===== Splash JOC =====
  var splash=$("splash"), t0=Date.now(), MIN_MS=2300, ready=false, splashDone=false;
  function hideSplash(){
    if(splashDone||!splash) return; splashDone=true;
    splash.classList.add("out");
    setTimeout(function(){splash.hidden=true},700);
  }
  function markReady(){
    if(ready) return; ready=true;
    var wait=MIN_MS-(Date.now()-t0);
    if(wait<=0) hideSplash(); else setTimeout(hideSplash,wait);
  }
  frame.addEventListener("load",function(){setTimeout(markReady,900)});
  window.addEventListener("message",function(e){
    if(e.source!==frame.contentWindow) return;
    var d=e.data; if(d&&(d.type==="yk-auth"||d.type==="yk-theme"||d.type==="yk-edge")) markReady();
  });
  setTimeout(hideSplash,12000);
  load();
})();
</script>
</body>
</html>
